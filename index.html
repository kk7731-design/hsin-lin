<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#145e55">
  <title>報修登記</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="./config.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main>
    <header><p class="eyebrow">讓問題被看見，讓處理有紀錄</p><h1>報修登記</h1><p>填寫問題，下方即可查看最新進度。</p></header>
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">新增報修</h2>
      <p class="hint">所有欄位皆必填。清單公開可見，示範請使用虛構姓名與地點，勿填入敏感資訊。</p>
      <p id="config-message" class="message" role="alert" hidden></p>
      <form id="repair-form">
        <fieldset id="form-fields" disabled>
          <div class="grid">
            <label>報修人<input name="reporter_name" required maxlength="100" autocomplete="off" placeholder="例如：虛構同事甲"></label>
            <label>地點或部門<input name="location" required maxlength="200" autocomplete="off" placeholder="例如：虛構門市甲"></label>
            <label>類別<select name="category" required><option value="">請選擇類別</option><option>設備</option><option>網路</option><option>環境</option><option>其他</option></select></label>
            <label>緊急程度<select name="urgency" required><option>低</option><option selected>中</option><option>高</option></select></label>
          </div>
          <label>問題說明<textarea name="description" required maxlength="5000" rows="5" placeholder="請描述問題、發生位置及影響"></textarea></label>
          <button type="submit" id="submit-button">送出報修</button>
        </fieldset>
      </form>
      <p id="form-message" class="message" role="status" aria-live="polite" hidden></p>
    </section>
    <section class="panel" aria-labelledby="list-title">
      <div class="section-heading"><div><h2 id="list-title">最近報修</h2><p class="hint">最近 20 筆，依登記時間由新到舊排列。</p></div><button id="refresh-button" type="button" class="secondary" disabled>重新整理</button></div>
      <p id="list-message" class="message" role="status" aria-live="polite">正在準備清單…</p>
      <ul id="repair-list" class="repair-list" aria-label="報修清單"></ul>
    </section>
    <footer>報修登記 · 示範系統</footer>
  </main>
</body>
</html>
