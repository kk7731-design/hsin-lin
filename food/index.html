        b.addEventListener("click", () => {
          setActive(text);
          container.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.textContent === text));
          render();
        });
        container.appendChild(b);
      });
    }

      shopOnly = !shopOnly;

      render();
    });

    hidToggle.addEventListener("click", () => {
      hidOnly = !hidOnly;
      hidToggle.setAttribute("aria-pressed", hidOnly);
      render();
    });

      const q = search.value.trim();
      const shown = foods.filter(f =>
        (region === "全部" || regionOf[f.county] === region) &&

        (type === "全部類型" || f.type === type) &&
        (!mustOnly || f.must) &&
        (!shopOnly || f.shop) &&
        (!hidOnly || f.hidden) &&
        (!q || [f.name, f.county, f.desc, f.where].some(s => s.includes(q))));

      list.innerHTML = "";
      counties.forEach(([c, r]) => {

          card.className = "card";
          card.innerHTML = `
            <div class="top"><h3></h3><span class="emoji" aria-hidden="true"></span></div>

            <p></p>
            <div class="where"></div>`;
          card.querySelector("h3").textContent = f.name;
          card.querySelector(".emoji").textContent = f.emoji;
          card.querySelector(".tag").textContent = f.type;
          card.querySelector(".must").hidden = !f.must;
          card.querySelector(".shop").hidden = !f.shop;
          card.querySelector(".hid").hidden = !f.hidden;
          card.querySelector("p").textContent = f.desc;
          card.querySelector(".where").textContent = "📍 " + f.where;
          grid.appendChild(card);
        });
        block.append(h, grid);
        list.appendChild(block);
      });
      const n = new Set(shown.map(f => f.county)).size;
      count.textContent = `共 ${n} 個縣市・${shown.length} 項美食`;
      empty.hidden = shown.length > 0;
    }

    fillCounties();
    search.addEventListener("input", render);
    countySel.addEventListener("change", render);

  <script>
    // 自動更新：手機瀏覽器可能顯示暫存的舊頁面，這裡向伺服器確認最新版本，有新版就重新載入。
    // 修改此頁內容時，請一併更新上方 <meta name="page-version"> 的版本字串。
    (() => {
      const current = document.querySelector('meta[name="page-version"]')?.content;
      if (!current || !window.fetch) return;
      let lastCheck = 0;
      async function checkUpdate() {
        if (Date.now() - lastCheck < 60000) return;
        lastCheck = Date.now();
        try {
          const url = location.pathname + "?_=" + Date.now();
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) return;
          const latest = (await res.text()).match(/<meta name="page-version" content="([^"]+)"/)?.[1];
          if (!latest || latest === current) return;
          const params = new URLSearchParams(location.search);
          if (params.get("v") === latest) return; // 已嘗試載入這個版本，避免重複重新整理
          params.set("v", latest);
          location.replace(location.pathname + "?" + params + location.hash);
        } catch { /* 離線或連線失敗時維持目前頁面 */ }
      }
      checkUpdate();
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
      window.addEventListener("pageshow", e => { if (e.persisted) checkUpdate(); });
    })();
  </script>
</body>
</html>
