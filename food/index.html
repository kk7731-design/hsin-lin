          render();
        });
        container.appendChild(b);
      });
    }

          card.querySelector(".hid").hidden = !f.hidden;

      const layers = document.querySelectorAll(".hero-img"), pageBg = document.getElementById("page-bg"), credit = document.getElementById("credit");
      let i = Math.floor(Math.random() * scenes.length), front = 0;
      function show(n) {
        const sc = scenes[n], url = `url("${sc.file}")`;
        const next = layers[1 - front];
        next.style.backgroundImage = url;
        next.classList.add("show"); layers[front].classList.remove("show"); front = 1 - front;
        pageBg.style.backgroundImage = url;
        credit.textContent = "";
        const a = document.createElement("a"); a.href = sc.page; a.target = "_blank"; a.rel = "noopener";
        a.textContent = `攝影：${sc.artist}（${sc.license}）`;
        credit.append(`📍 ${sc.place}・`, a);
      }
      show(i);
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      setInterval(() => {
        if (document.hidden) return;
        const n = (i + 1) % scenes.length, img = new Image();
        img.onload = () => { i = n; show(i); };
        img.src = scenes[n].file;
      }, 9000);
    })();

  <script>
    // 自動更新：手機瀏覽器可能顯示暫存的舊頁面，這裡向伺服器確認最新版本，有新版就重新載入。
    // 修改此頁內容時，請一併更新上方 <meta name="page-version"> 的版本字串。
    (() => {
      const current = document.querySelector('meta[name="page-version"]')?.content;
      if (!current || !window.fetch) return;
      let lastCheck = 0;
      async function checkUpdate() {
        if (Date.now() - lastCheck < 60000) return;
        lastCheck = Date.now();
        try {
          const url = location.pathname + "?_=" + Date.now();
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) return;
          const latest = (await res.text()).match(/<meta name="page-version" content="([^"]+)"/)?.[1];
          if (!latest || latest === current) return;
          const params = new URLSearchParams(location.search);
          if (params.get("v") === latest) return; // 已嘗試載入這個版本，避免重複重新整理
          params.set("v", latest);
          location.replace(location.pathname + "?" + params + location.hash);
        } catch { /* 離線或連線失敗時維持目前頁面 */ }
      }
      checkUpdate();
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
      window.addEventListener("pageshow", e => { if (e.persisted) checkUpdate(); });
    })();
  </script>
