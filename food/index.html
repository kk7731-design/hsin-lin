      countySel.value = [...countySel.options].some(o => o.value === keep) ? keep : "";
    }

    function chipGroup(container, items, getActive, setActive) {
      items.forEach(text => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "chip"; b.textContent = text;
        b.setAttribute("aria-pressed", text === getActive());
        b.addEventListener("click", () => {
          setActive(text);
          container.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.textContent === text));
          render();
        });
        container.appendChild(b);
      });
    }
    chipGroup($("regions"), regionList, () => region, v => { region = v; fillCounties(); });
    chipGroup($("types"), typeList, () => type, v => type = v);

    function render() {

        (region === "全部" || regionOf[f.county] === region) &&

        (!shopOnly || f.shop) &&

        (!stlOnly || f.stall) &&
        (!q || [f.name, f.county, f.desc, f.where].some(s => s.includes(q))));

      list.innerHTML = "";
      counties.forEach(([c, r]) => {
        const items = shown.filter(f => f.county === c);
        if (!items.length) return;
        const block = document.createElement("section");
        block.className = "county-block";
        const h = document.createElement("h2");
        h.textContent = c;

        block.append(h, grid);

  <script>
    // 自動更新：手機瀏覽器可能顯示暫存的舊頁面，這裡向伺服器確認最新版本，有新版就重新載入。
    // 修改此頁內容時，請一併更新上方 <meta name="page-version"> 的版本字串。
    (() => {
      const current = document.querySelector('meta[name="page-version"]')?.content;
      if (!current || !window.fetch) return;
      let lastCheck = 0;
      async function checkUpdate() {
        if (Date.now() - lastCheck < 60000) return;
        lastCheck = Date.now();
        try {
          const url = location.pathname + "?_=" + Date.now();
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) return;
          const latest = (await res.text()).match(/<meta name="page-version" content="([^"]+)"/)?.[1];
          if (!latest || latest === current) return;
          const params = new URLSearchParams(location.search);
          if (params.get("v") === latest) return; // 已嘗試載入這個版本，避免重複重新整理
          params.set("v", latest);
          location.replace(location.pathname + "?" + params + location.hash);
        } catch { /* 離線或連線失敗時維持目前頁面 */ }
      }
      checkUpdate();
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
      window.addEventListener("pageshow", e => { if (e.persisted) checkUpdate(); });
    })();
  </script>
