<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b4451f">

  <style>
    :root {
      --bg: #fdf6ec; --card: #ffffff; --text: #2b2118; --muted: #7a6a5c;
      --accent: #b4451f; --accent-soft: #f7dfcf; --line: #eadccb;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1d1814; --card: #2a231d; --text: #f3e9dd; --muted: #b9a896;
              --accent: #f08a5d; --accent-soft: #4a2e20; --line: #3d332a; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font-family: system-ui, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; line-height: 1.6; }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
    header h1 { margin: 0; font-size: 2rem; }
    header p { margin: 4px 0 0; color: var(--muted); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; align-items: center; }
    .toolbar input, .toolbar select { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
                     background: var(--card); color: var(--text); font-size: 1rem; }
    .toolbar input { flex: 1 1 200px; }
    .chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px;
            padding: 8px 14px; font-size: .95rem; cursor: pointer; }
    .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .count { color: var(--muted); font-size: .9rem; margin-top: 14px; }
    .county-block { margin-top: 22px; }
    .county-block h2 { margin: 0 0 8px; font-size: 1.25rem; display: flex; align-items: baseline; gap: 8px; }
    .county-block h2 small { color: var(--muted); font-weight: 400; font-size: .85rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
    .card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .card h3 { margin: 0; font-size: 1.1rem; }
    .emoji { font-size: 1.8rem; }
    .tag { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 6px;
           padding: 0 8px; font-size: .8rem; margin-top: 4px; }
    .card p { margin: 8px 0 0; color: var(--muted); font-size: .95rem; }
    .where { margin-top: 8px; font-size: .9rem; }
    .empty { color: var(--muted); text-align: center; padding: 32px 0; }
    footer { margin-top: 32px; color: var(--muted); font-size: .85rem; text-align: center; }
  </style>
</head>
<body>
  <main>
    <header>

      <p>走訪台灣 22 個縣市，看看每個地方最有名的在地味道。</p>
    </header>

    <div class="toolbar">

      <select id="county" aria-label="選擇縣市"></select>
    </div>
    <div class="toolbar" id="regions" role="group" aria-label="地區篩選"></div>
    <div class="toolbar" id="types" role="group" aria-label="類型篩選"></div>

    <p class="count" id="count" aria-live="polite"></p>
    <div id="list"></div>
    <p class="empty" id="empty" hidden>找不到符合的小吃，換個關鍵字試試看。</p>

    <footer>資料為各地常見代表小吃的整理，僅供參考；店家營業時間與價格請以現場為準</footer>
  </main>

      { county: "澎湖縣", name: "黑糖糕", emoji: "🟫", type: "伴手禮", desc: "黑糖蒸成的鬆軟糕點，撒上芝麻，是澎湖代表伴手禮。", where: "馬公市區" },
      { county: "澎湖縣", name: "仙人掌冰", emoji: "🌵", type: "甜品", desc: "用仙人掌果實做成的紫紅色冰品，酸甜清爽。", where: "馬公市區、各景點" },
      { county: "金門縣", name: "貢糖", emoji: "🥜", type: "伴手禮", desc: "花生與麥芽糖反覆捶打製成，香酥不黏牙。", where: "金城鎮" },
      { county: "金門縣", name: "廣東粥", emoji: "🥣", type: "主食", desc: "米粒熬到化開的綿密粥，加入豬肉、皮蛋與油條，是金門人的早餐。", where: "金城鎮" },
      { county: "連江縣", name: "繼光餅", emoji: "🥯", type: "點心", desc: "中間有洞的烤餅，相傳是戚繼光行軍的乾糧，夾蛋或肉吃。", where: "南竿" },
      { county: "連江縣", name: "老酒麵線", emoji: "🍜", type: "主食", desc: "用馬祖老酒煮的麵線，加荷包蛋，暖身又香醇。", where: "南竿、北竿" }
    ];

    const regionList = ["全部", "北部", "中部", "南部", "東部", "離島"];
    const typeList = ["全部類型", "主食", "點心", "甜品", "伴手禮"];
    let region = "全部", type = "全部類型";

    const $ = id => document.getElementById(id);
    const list = $("list"), empty = $("empty"), search = $("search"), countySel = $("county"), count = $("count");

    function fillCounties() {
      const keep = countySel.value;
      countySel.innerHTML = "";
      const all = document.createElement("option"); all.value = ""; all.textContent = "全部縣市"; countySel.appendChild(all);
      counties.filter(([c, r]) => region === "全部" || r === region).forEach(([c]) => {
        const o = document.createElement("option"); o.value = c; o.textContent = c; countySel.appendChild(o);
      });
      countySel.value = [...countySel.options].some(o => o.value === keep) ? keep : "";
    }

    function chipGroup(container, items, getActive, setActive) {
      items.forEach(text => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "chip"; b.textContent = text;
        b.setAttribute("aria-pressed", text === getActive());
        b.addEventListener("click", () => {
          setActive(text);
          container.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.textContent === text));
          render();
        });
        container.appendChild(b);
      });
    }
    chipGroup($("regions"), regionList, () => region, v => { region = v; fillCounties(); });
    chipGroup($("types"), typeList, () => type, v => type = v);

    function render() {
      const q = search.value.trim();
      const shown = foods.filter(f =>
        (region === "全部" || regionOf[f.county] === region) &&
        (!countySel.value || f.county === countySel.value) &&
        (type === "全部類型" || f.type === type) &&
        (!q || [f.name, f.county, f.desc, f.where].some(s => s.includes(q))));

      list.innerHTML = "";
      counties.forEach(([c, r]) => {
        const items = shown.filter(f => f.county === c);
        if (!items.length) return;
        const block = document.createElement("section");
        block.className = "county-block";
        const h = document.createElement("h2");
        h.textContent = c;
        const small = document.createElement("small"); small.textContent = r;
        h.appendChild(small);
        const grid = document.createElement("div"); grid.className = "grid";
        items.forEach(f => {
          const card = document.createElement("article");
          card.className = "card";
          card.innerHTML = `
            <div class="top"><h3></h3><span class="emoji" aria-hidden="true"></span></div>
            <span class="tag"></span>
            <p></p>
            <div class="where"></div>`;
          card.querySelector("h3").textContent = f.name;
          card.querySelector(".emoji").textContent = f.emoji;
          card.querySelector(".tag").textContent = f.type;
          card.querySelector("p").textContent = f.desc;
          card.querySelector(".where").textContent = "📍 " + f.where;
          grid.appendChild(card);
        });
        block.append(h, grid);
        list.appendChild(block);
      });
      const n = new Set(shown.map(f => f.county)).size;
      count.textContent = `共 ${n} 個縣市・${shown.length} 種小吃`;
      empty.hidden = shown.length > 0;
    }

    fillCounties();
    search.addEventListener("input", render);
    countySel.addEventListener("change", render);
    render();
  </script>
</body>
</html>
